#
# Each job runs one `just` recipe inside the dev shell, so CI runs exactly what
# `just check` runs locally. Separate jobs show which rule failed at a glance.
name: CI

on:
  # Every PR, whatever its base, so stacked PRs get checks too.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main are never cancelled,
# so every push there is checked and saves its cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write # purge old Nix store caches (pushes to main only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c just lint

  # The committed generated code is what `just generate` makes from proto/.
  generate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write # purge old Nix store caches (pushes to main only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c just check-generated

  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write # purge old Nix store caches (pushes to main only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c just test

  licenses:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write # purge old Nix store caches (pushes to main only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c just licenses

  vuln:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write # purge old Nix store caches (pushes to main only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c just vuln

  commits:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write # purge old Nix store caches (pushes to main only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      # The PR's own commits (base..head, not the merge ref GitHub checks
      # out), or the commits a push to main added.
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$PUSH_AFTER~1..$PUSH_AFTER" # a new branch: its tip
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          nix develop -c just lint-commits "$range"

  # A GitHub x86 runner can use /dev/kvm, the dev shell's libkrun and
  # libkrunfw meet the minimums, and the tests that boot VMs pass.
  kvm:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write # purge old Nix store caches (pushes to main only)
    env:
      # A fork's PRs get no secrets: they skip the login and pull
      # anonymously, under Docker Hub's shared limit.
      DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Grant /dev/kvm read-write to everyone
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check /dev/kvm opens read-write
        run: |
          ls -l /dev/kvm
          exec 3<>/dev/kvm
          echo "/dev/kvm opened read-write as $(id -un)"
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c just check-libs
      # The protocol test pulls e2e/image from Docker Hub. Logged in, its
      # pulls count against this account's limit, not the runner's shared
      # address (docs/development.md, The test image). The plugin reads
      # the login from ~/.docker/config.json.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Asserts the library minimums and builds the dev shell.
      - run: nix flake check
      # Every test, with the `kvm` tag and the payload embedded. -v lists
      # each test's result, so the log shows the root cases ran, and the
      # Start time tests' times (VM-11).
      - run: nix develop -c just test-kvm -v
