#
# `just generate`: the Go code for the protocols, from the dev shell's
# protoc-gen-go and protoc-gen-go-grpc, with no Buf Schema Registry. Each
# package's Go import path comes from managed mode, so the .proto files carry
# no go_package; forgejo-runner's plugin protocol (proto/plugin/) keeps the
# runner's, and managed mode overrides it too. The VM child spec is generated
# under internal/job, so only the job binary can import it.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/chrishoage/forgejo-runner-plugin-microvm/internal/gen
    - file_option: go_package_prefix
      path: runnermicrovm/vm
      value: github.com/chrishoage/forgejo-runner-plugin-microvm/internal/job/internal/gen
plugins:
  - local: protoc-gen-go
    out: .
    opt: module=github.com/chrishoage/forgejo-runner-plugin-microvm
  - local: protoc-gen-go-grpc
    out: .
    opt: module=github.com/chrishoage/forgejo-runner-plugin-microvm
