#
# The protocols' sources. `buf lint` (in `just lint`) checks them at the
# STANDARD rules; docs/development.md (Protocols and codegen) has the rest.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # forgejo-runner's plugin protocol, kept byte for byte as the runner ships
  # it: its names are the runner's, not ours to change.
  ignore:
    - proto/plugin
