#
# big.yml, holding its VM for the "seconds" input, 60 by default, between
# two prints of its shape: a reload while it runs must not change the job's
# shape (docs/development.md, The local harness). The protocol test
# dispatches it with 1.
name: hold

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: how long the job holds its VM
        type: string
        default: "60"

jobs:
  hold:
    runs-on: microvm-big
    steps:
      - run: echo "hello from runner-microvm e2e"
      - run: |
          echo "shape: cpus=$(nproc) memtotal_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo) vda_sectors=$(cat /sys/block/vda/size)"
      - run: sleep ${{ inputs.seconds }}
      - run: |
          echo "shape: cpus=$(nproc) memtotal_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo) vda_sectors=$(cat /sys/block/vda/size)"
