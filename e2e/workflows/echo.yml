#
# The simplest real workflow: one job, whose label names no profile. `just
# e2e run` pushes it to the harness, and the protocol test reads this same
# file. The second step prints the VM's shape, which the protocol test checks
# against the built-in profile; its line must stay cmd/protocol_test.go's
# shapeStep.
name: echo

on:
  workflow_dispatch:

jobs:
  echo:
    runs-on: microvm
    steps:
      - run: echo "hello from runner-microvm e2e"
      - run: |
          echo "shape: cpus=$(nproc) memtotal_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo) vda_sectors=$(cat /sys/block/vda/size)"
