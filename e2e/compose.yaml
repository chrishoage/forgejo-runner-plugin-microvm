#
# The local harness: a real Forgejo and a real forgejo-runner, started by
# `just e2e up` (e2e/mod.just). Everything the stack writes is bind-mounted
# under .e2e/ at the repo root, which `just e2e down` deletes. Each decision
# and its reason is in docs/development.md (The local harness). The project
# name is not set here: the recipes name one per checkout.

services:
  forgejo:
    # Pinned by tag and digest; Renovate's compose manager updates both.
    image: data.forgejo.org/forgejo/forgejo:17.0.2@sha256:879f4f10a98e3e167b32cde5f7ae3af0163d50bfacf567559a27a0e95a95670c
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__actions__ENABLED: "true"
    volumes:
      - ../.e2e/forgejo:/data
    # Only the API, and only on loopback: nothing else needs to reach it
    # from outside the stack.
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:3000/api/healthz]
      interval: 2s
      timeout: 5s
      retries: 60

  runner:
    # forgejo-runner v13.2.2, moved with the runner's Go module by one
    # Renovate group (renovate.json5).
    image: data.forgejo.org/forgejo/runner:13.2.2@sha256:a8543a45fe62bebef0534d5c223cf485d3294e6dd2e42a82dbcbfd40c54a6a22
    # Root, so it can open the plugin's socket, whose mode comes from the
    # plugin's umask: under rootless podman, container root is the host user
    # who owns the socket; under rootful Docker it is real root.
    user: "0:0"
    depends_on:
      forgejo:
        condition: service_healthy
    # Registered offline: Forgejo already knows the shared secret
    # (`just e2e up` runs `forgejo-cli actions register` first), so no
    # registration token and no API round trip.
    entrypoint:
      - sh
      - -euc
      - |
        forgejo-runner --config /etc/forgejo-runner/config.yaml create-runner-file \
          --instance http://forgejo:3000 \
          --name e2e --secret "$$(cat /secrets/runner-secret)"
        exec forgejo-runner daemon --config /etc/forgejo-runner/config.yaml
    volumes:
      - ../.e2e/runner:/data
      - ../.e2e/secrets:/secrets:ro
      - ../.e2e/runner-config.yaml:/etc/forgejo-runner/config.yaml:ro
      # The plugin's runtime directory, with its listen socket. The plugin
      # runs on the host, for /dev/kvm and libkrun (`just e2e up`).
      - ../.e2e/plugin/runtime:/run/runner-microvm
