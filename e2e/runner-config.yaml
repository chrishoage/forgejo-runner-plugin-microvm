#
# forgejo-runner's config in the local harness (docs/development.md).
log:
  level: info
  job_level: info

runner:
  file: /data/.runner
  capacity: 1
  # The runner's built-in host backend, so the harness proves itself before
  # the plugin exists. #33 maps this label to the plugin instead; the
  # workflow stays the same.
  labels:
    - microvm:host

cache:
  # Off: the slice's guest has no network until #7, and nothing here needs
  # a cache.
  enabled: false
