#
# forgejo-runner's config in the local harness (docs/development.md). `just
# e2e up` writes it to .e2e/runner-config.yaml with @IMAGE@ replaced by the
# image in e2e/image, the one the protocol test runs too.
log:
  level: info
  job_level: info

runner:
  file: /data/.runner
  capacity: 1
  # The workflows' labels, routed to the plugin with the test image:
  # microvm names no profile, so it gets default; microvm-big names big.
  labels:
    - microvm:runner-microvm://@IMAGE@
    - microvm-big:runner-microvm://@IMAGE@;profile=big

cache:
  # Off: nothing here needs a cache, and the guest can't reach a cache
  # server on the host's loopback (NET-4).
  enabled: false

plugins:
  # The key is the label's scheme. The plugin runs on the host; its runtime
  # directory, which holds its listen socket, is mounted here.
  runner-microvm:
    address: unix:///run/runner-microvm/runner-microvm.sock
