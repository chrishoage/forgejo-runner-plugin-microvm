syntax = "proto3";

// The VM child's spec: what the job process tells the VM child it starts. It
// is private to the job binary, and its generated code lives under
// internal/job, so the plugin can't depend on it. It describes one VM: the
// job process starts one VM child for each entry of the job spec's vms.
//
// The VM child reads one Spec from stdin as length-delimited protobuf
// (protodelim). It also inherits:
//   - fd 3: the liveness pipe;
//   - fd 4: the VM's end of the job network socket;
//   - fd 5 and up: each disk's file, opened by the job process, in the
//     order of disks: disks[i] is fd 5+i;
//   - stdout and stderr: the VM log file.
package runnermicrovm.vm.v1;

import "runnermicrovm/agent/v1/agent.proto";

// Spec is everything the VM child needs to configure libkrun and start its
// VM. It never appears on a command line.
message Spec {
  // The directory holding libkrun.so.1 and libkrunfw.so.5. Empty: load them
  // by soname (VM-10).
  string lib_dir = 1;
  // The VM's shape (VM-4).
  uint32 cpus = 2;
  uint32 memory_mib = 3;
  // The VM's boot root, <state>/jobs/<id>/<n>/root/, which libkrun shares
  // read-only as the VM's root: empty proc, sys and dev mount points, the
  // agent and its boot config. It is the bottom layer of the guest's root.
  string root_dir = 4;
  // The scratch disk's file, already created by the job process (VM-5).
  string scratch_disk = 5;
  // The VM's layer link directory, shared read-only (IMG-8, IMG-9), and the
  // virtiofs tag it is shared under: the same value as the boot config's
  // layer_tag, which the agent mounts.
  string layer_dir = 6;
  string layer_tag = 14;
  // The file libkrun writes the VM's console to.
  string console = 7;
  // The unix socket libkrun maps to the agent's vsock port, and that port:
  // the same value as the boot config's vsock_port.
  string agent_socket = 8;
  uint32 agent_port = 9;
  // The VM's mounts and disks (STO-1), in the profile's order. Today
  // they come only from the label's profile, because the plugin protocol
  // passes no workflow mounts or volumes.
  repeated Mount mounts = 10;
  repeated Disk disks = 11;
  // The VM's MAC on the job network, whose frame socket is fd 4: a
  // SOCK_DGRAM socket, one Ethernet frame per datagram.
  string guest_mac = 12;
  // The agent's boot config, passed on to the agent unopened.
  runnermicrovm.agent.v1.BootConfig boot = 13;
  // libkrun's log level, from the job spec: "warn", "info", "debug" or
  // "trace". Any other value, the empty one included, fails the VM before
  // libkrun is called.
  string libkrun_log_level = 15;
}

// Mount is a host directory shared into the VM (STO-1).
message Mount {
  string source = 1;
  string tag = 2;
  // Read-only unless set, enforced by libkrun on the host side (STO-2).
  bool read_write = 3;
}

// Disk is a host file attached as a block device (STO-1).
message Disk {
  // The host file, for messages. libkrun attaches the disk through its
  // inherited descriptor (fd 5 and up), as /proc/self/fd/<n>, never by this
  // path, so the file attached is the file the job process opened.
  string source = 1;
  // The block id libkrun attaches it under, which the guest sees as its
  // serial: 1 to 20 bytes.
  string block_id = 3;
  // Read-only unless set, enforced by libkrun on the host side (STO-2).
  bool read_write = 2;
}
