syntax = "proto3";

// The control channel between the plugin and a job process. The plugin
// writes one Spec to the job process's stdin, and the job process writes
// Events to its stdout, both as length-delimited protobuf (protodelim). The
// job process's stderr is its log file, and fd 3 is the liveness pipe. It is
// not gRPC: one message in and a handful out don't need a server.
package runnermicrovm.job.v1;

import "runnermicrovm/agent/v1/agent.proto";

// Spec is everything a job process needs to run one job: its job network and
// every VM on it. It never appears on a command line.
message Spec {
  // The job's environment id, for log lines.
  string job = 1;
  // The job binary's own path. The job process starts each VM child by
  // running it with `vm`; it never execs os.Executable().
  string job_binary = 2;
  // The directory holding libkrun.so.1 and libkrunfw.so.5. Empty: load them
  // by soname from the system (VM-10).
  string lib_dir = 3;
  // The job network, shared by every VM in vms (NET-1).
  Network network = 4;
  // The job's VMs, each run by its own VM child, all on the one job network.
  // A VM is identified by its index here: index 0 is always the job's
  // container, the VM the plugin's Exec runs in, and services follow, in
  // order. Events name a VM by its index, and its directories are named by
  // it: <state>/jobs/<id>/<n>/, <runtime>/<id>/<n>/ and
  // <cache>/jobs/<id>/<n>/, where <n> is the index. The plugin chooses the
  // index, so a workflow can't make two VMs collide or make a path leave its
  // directory.
  //
  // Today vms always holds exactly one VM, the job's container, because the
  // plugin protocol passes a service only its name, image, env and ports,
  // and no VM options: a job that declares services fails at Create, and the
  // job process rejects a spec whose vms count isn't one with Failed. The
  // shape is built for more: services become more VMs of the same job, each
  // another entry in vms, on the same job network and in the same job
  // process, and that shape needs no redesign. What a service needs beyond
  // it is added fields and calls, for example its entrypoint and cmd at boot
  // and the plugin dialling its agent. Where a service VM's shape and
  // storage come from is decided when services are.
  repeated VM vms = 5;
  // The host's mkfs.ext4, which the plugin found at startup. The job process
  // formats each VM's scratch disk with it (VM-5).
  string mkfs_ext4 = 6;
  // libkrun's log level for each of the job's VMs, the plugin's
  // libkrun_log_level: "warn", "info", "debug" or "trace". The job process
  // passes it on to each VM child, and a VM child refuses any other value.
  string libkrun_log_level = 7;
  // The log level of the job process and of each of its VM children, the
  // plugin's log_level: "debug", "info", "warn" or "error". The job process
  // passes it on to each VM child; either fails on any other value, the
  // empty one included.
  string log_level = 8;
}

// VM is one of the job's VMs, run by one VM child.
message VM {
  // The VM's name, unique within the spec: its hostname and its name in
  // every VM's BootConfig.hosts, log lines and Failed reasons. It is never a
  // path component or a cache key: a service's name would be its key in the
  // workflow, which the workflow chooses and which may be `job` or `0`, made
  // DNS-safe by the same rule. The job's container's name is the job's name
  // made DNS-safe, or `job` (GST-12).
  string name = 1;
  // The VM's shape (VM-4).
  uint32 cpus = 2;
  uint32 memory_mib = 3;
  // The VM's scratch disk's file, created fresh by the job process in
  // <state>/jobs/<id>/<n>/, and its size (VM-5): a sparse file of that
  // apparent size, mode 0600, formatted as ext4. It is the VM's first block
  // device, /dev/vda, read-write.
  string scratch_disk = 4;
  uint64 scratch_size_bytes = 5;
  // The VM log file (the VM child's stdout and stderr) and the console file,
  // both in <state>/jobs/<id>/<n>/.
  string vm_log = 6;
  string console = 7;
  // The unix socket libkrun maps to the agent's vsock port, which the plugin
  // dials, in <runtime>/<id>/<n>/, and that port: 1024, the same value as
  // the boot config's vsock_port, which the agent listens on.
  string agent_socket = 8;
  uint32 agent_port = 9;
  // The VM's boot root, <state>/jobs/<id>/<n>/root/, which libkrun shares
  // read-only as the VM's root: empty proc, sys and dev mount points, the
  // agent and its boot config. It is the bottom layer of the guest's root.
  string root_dir = 10;
  // The VM's layer link directory, <cache>/jobs/<id>/<n>/, shared into the
  // VM read-only (IMG-8, IMG-9), and the virtiofs tag it is shared under:
  // `layers`, the same value as the boot config's layer_tag, which the agent
  // mounts.
  string layer_dir = 11;
  string layer_tag = 17;
  // The VM's mounts and disks (STO-1), in the profile's order. Today
  // they come only from the label's profile, because the plugin protocol
  // passes no workflow mounts or volumes.
  repeated Mount mounts = 12;
  repeated Disk disks = 13;
  // The VM's address and MAC on the job network. The agent sets the
  // address statically, from the boot config; the job network's DHCP
  // server, which no VM uses, reserves it for the MAC.
  string guest_address = 14;
  string guest_mac = 15;
  // The agent's boot config, passed on to the VM child unopened.
  runnermicrovm.agent.v1.BootConfig boot = 16;
}

// Mount is a host directory a VM shares (STO-1).
message Mount {
  // The absolute host directory.
  string source = 1;
  // The tag it is shared under; the boot config names the same tag.
  string tag = 2;
  // Read-only unless set; enforced on the host side (STO-2).
  bool read_write = 3;
}

// Disk is a host file a VM attaches as a block device (STO-1).
message Disk {
  // The absolute host file. The job process opens it before it starts the
  // VM child, read-only for a read-only disk; one that is missing or not a
  // regular file fails the job, naming it (PROTO-10).
  string source = 1;
  // The block id libkrun attaches it under; the boot config names the same
  // id.
  string block_id = 3;
  // Every disk takes a disk lock on the file the job process opened: an
  // exclusive flock for a read-write disk, a shared one for a read-only
  // disk, held until that VM's VM child has exited, and released by the
  // kernel if the job process or the VM child dies first. A disk another
  // process holds a conflicting lock on fails the job: `disk <source> is in
  // use by another process` (STO-7, STO-8).
  //
  // A disk named twice in one job, in one VM or in two, where either is
  // read-write, fails at Create, so a spec never holds one: one process
  // can't hold an exclusive flock and a shared or second exclusive one on
  // one file through two opens. A disk named twice read-only both times
  // may be shared by a job's VMs, since shared locks don't block each other.
  bool read_write = 2;
}

// Network is the job network's configuration (NET-*): gvisor-tap-vsock's
// switch, gateway, DNS server and forwarders, configured with no NAT, no
// gateway virtual IPs, no port forwards and no DNS zones, so no address maps
// to the host's loopback (NET-4) and no host port is forwarded (NET-3). The
// gateway serves DNS, and a DHCP server no VM uses whose leases are fixed to
// each VM's address and MAC (NET-6).
message Network {
  // hosts: the gateway's DNS serves no names of its own; each VM's names are
  // in its boot config's hosts.
  reserved 5;
  reserved "hosts";

  // The job network's subnet, in CIDR notation.
  string subnet = 1;
  // The gateway's address and MAC: every VM's default route and its only
  // name server (NET-5).
  string gateway_address = 2;
  string gateway_mac = 3;
  uint32 mtu = 4;
}

// Event is one status event from the job process, in the order they happen.
message Event {
  oneof event {
    NetworkUp network_up = 1;
    VMStarted vm_started = 2;
    VMExited vm_exited = 3;
    Failed failed = 4;
  }
}

// NetworkUp: the job network is serving every VM's socket. It comes before
// any VM starts.
message NetworkUp {}

// VMStarted: one VM's VM child is running.
message VMStarted {
  // The VM's index in Spec.vms; 0 is the job's container.
  uint32 vm = 1;
  // The VM child's process id, for log lines.
  int32 pid = 2;
}

// VMExited: one VM's VM child has exited.
//
// When the job's container (index 0) exits, the job ends: the job process
// kills the other VM children, reports each one's VMExited once it is reaped,
// and exits. What a service VM exiting does to the job is decided with
// services.
message VMExited {
  // The VM's index in Spec.vms; 0 is the job's container.
  uint32 vm = 1;
  // The VM child's exit code.
  int32 exit_code = 2;
  // The end of the VM's console file, for the error that names why the VM
  // stopped (VM-8, PROTO-10).
  string console_tail = 3;
  // The end of the VM's log file.
  string log_tail = 4;
}

// Failed: the job process could not set up the job and is exiting.
message Failed {
  // Why, naming the cause: the network, a scratch disk, a disk, or a VM
  // child, and the VM it belongs to by name (PROTO-10). A job network that
  // fails to start gives `network: <error>`, which Start reports as
  // FailedPrecondition.
  string reason = 1;
  // Set when only a bug in the plugin can cause the failure: the job spec
  // can't be read, or doesn't describe a job. Start reports it as Internal,
  // the code for the plugin's own bugs (PROTO-10).
  bool bug = 2;
}
