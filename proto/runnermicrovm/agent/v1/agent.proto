syntax = "proto3";

// The agent protocol: the plugin's own protocol between the plugin and the
// agent inside each of a job's VMs. The plugin dials a VM's agent over the
// unix socket libkrun maps to the guest's vsock port, in that VM's runtime
// directory, <runtime>/<id>/<n>/
// (docs/adr/0003-plugin-talks-to-agent-directly.md). The agent listens on the
// vsock port its boot config names, and the VM is ready when it answers Ping.
package runnermicrovm.agent.v1;

// AgentService prepares a VM at boot, runs commands inside it and copies files
// in and out. The job's steps run through the job's container's agent.
service AgentService {
  // Ping answers once the agent has finished its boot mounts and can serve
  // every other call. A VM is ready when its agent answers Ping. Today the
  // job's container is the only VM, because the plugin protocol passes no VM
  // options for services, so its agent is the only one the plugin dials.
  rpc Ping(PingRequest) returns (PingResponse);

  // Exec runs one step's command and streams its output, then its exit code
  // or the reason it could not start. Cancelling the call kills the command's
  // process group at once (GST-8).
  rpc Exec(ExecRequest) returns (stream ExecResponse);

  // CopyIn extracts a tar at a destination in the guest (GST-10).
  rpc CopyIn(stream CopyInRequest) returns (CopyInResponse);

  // CopyOut returns a guest path as a tar (GST-11).
  rpc CopyOut(CopyOutRequest) returns (stream CopyOutResponse);

  // Flush writes everything on the VM's read-write mounts and disks through
  // to the host, before a job with read-write storage ends normally (STO-9):
  // sync(), then FIFREEZE on each read-write disk's mount, which leaves its
  // ext4 clean. The disks stay frozen: the VM is killed right after. It
  // fails with FailedPrecondition, naming each disk it could not freeze.
  rpc Flush(FlushRequest) returns (FlushResponse);
}

message PingRequest {}

message PingResponse {}

message ExecRequest {
  // The command and its arguments, run directly, never through a shell. The
  // command is looked up in the environment's PATH, or in a default PATH when
  // none is set (GST-4).
  repeated string argv = 1;
  // Laid over the image's environment (GST-4). The values are secrets: they
  // must not appear in logs, host files or command lines (LOG-2).
  map<string, string> env = 2;
  // A user name or id, optionally with `:group`, resolved against the image's
  // /etc/passwd and /etc/group. Empty: the image's user, else root (GST-5).
  string user = 3;
  // Empty: the image's working directory, else `/`. A missing one is created,
  // owned by the exec user (GST-6).
  string working_dir = 4;
}

message ExecResponse {
  // The responses of one Exec are output chunks, in the order they were
  // written, then exactly one exit_code or start_error, which ends the stream.
  oneof event {
    // A chunk of the command's standard output.
    bytes stdout = 1;
    // A chunk of the command's standard error.
    bytes stderr = 2;
    // The command's exit code, or 128+n when signal n ended it (GST-7).
    int32 exit_code = 3;
    // Why the command could not start, for example a missing executable
    // (GST-7). Not an exit code.
    string start_error = 4;
  }
}

message CopyInRequest {
  // The absolute guest directory to extract into, set in the first request
  // only. It and its missing parents are created (GST-10).
  string destination = 1;
  // The next chunk of the tar archive. An empty archive sends no chunk.
  bytes chunk = 2;
}

message CopyInResponse {}

message CopyOutRequest {
  // The absolute guest path to archive. A missing path returns an empty tar
  // (GST-11).
  string path = 1;
}

message CopyOutResponse {
  // The next chunk of the tar archive, entries named relative to the path's
  // parent (GST-11).
  bytes chunk = 1;
}

message FlushRequest {}

message FlushResponse {}

// BootConfig is everything the agent needs to prepare the guest before it
// serves: its root filesystem, mounts, disks, network and the image's
// defaults for Exec. The plugin builds it; the job spec and the VM child spec
// carry it unopened. It reaches the agent as a file in the VM's boot root,
// /.runner-microvm/boot-config.binpb, encoded as binary protobuf.
message BootConfig {
  // The guest directory where the agent mounts the VM's layer link
  // directory's share: /dev/.runner-microvm/layers, under the agent's
  // staging directory, since the devtmpfs is the one writable place before
  // the job's root exists.
  string layer_dir = 1;
  // The virtiofs tag the VM's layer link directory is shared under, which
  // the agent mounts: `layers`. Only the plugin sets it: the same value is
  // the tag libkrun shares the directory under.
  string layer_tag = 13;
  // The image's layers as file names in layer_dir, bottom layer first. Each
  // is mounted as a file-backed EROFS, and the agent stacks them in one
  // overlay over the boot root, with a writable layer on the scratch disk
  // (GST-2).
  repeated string layers = 2;
  // The scratch disk's guest block device, for example /dev/vda.
  string scratch_device = 3;
  // Guest paths that live on the scratch disk instead of the overlay
  // (GST-13).
  repeated string scratch_paths = 4;
  // The VM's mounts and disks (STO-1), mounted after the guest's own mounts
  // (STO-6). Today they come only from the label's profile, because the
  // plugin protocol passes no workflow mounts or volumes.
  repeated Mount mounts = 5;
  repeated Disk disks = 6;
  // The guest's address on the job network.
  Network network = 7;
  // The guest's hostname, its VM's name on the job network. The job's
  // container's is the job's name made DNS-safe, or `job` (GST-12). The
  // agent sets it with sethostname and writes it to /etc/hostname.
  string hostname = 8;
  // The image's defaults for Exec.
  Image image = 9;
  // The names on the job network, which the agent writes into /etc/hosts
  // after localhost's lines. There is no DNS zone for them. Today it holds
  // one entry, the VM's own name at its address; each service will add
  // one.
  repeated Host hosts = 10;
  // The vsock port the agent listens on, once its boot work is done. Only
  // the plugin sets it: the same value is libkrun's port mapping for the
  // VM's agent socket.
  uint32 vsock_port = 11;
  // The directories steps expect, which Create returned to the runner: the
  // act path, the tool cache and the temp directory (PROTO-7). The agent
  // creates each one the image lacks, after its own mounts, both before the
  // scratch paths and again after them, root-owned, with its mode, and any
  // missing parent mode 0755; one the image has is left as it is.
  repeated GuestDir guest_dirs = 12;
  // The agent's log level, the plugin's log_level: "debug", "info", "warn"
  // or "error". The agent fails its boot on any other value, the empty one
  // included.
  string log_level = 14;
}

// GuestDir is a directory the agent creates in the job's root when the image
// lacks it.
message GuestDir {
  // An absolute, clean guest path below /.
  string path = 1;
  // Its permission bits, set explicitly so the umask can't drop one, such as
  // the temp directory's sticky bit: 0 to 07777.
  uint32 mode = 2;
}

// Host is one name on the job network and its address.
message Host {
  // A DNS label.
  string name = 1;
  // An IPv4 address.
  string address = 2;
}

// Mount is a host directory shared into the VM (STO-1).
message Mount {
  // The tag the host shares the directory under.
  string tag = 1;
  // The absolute guest path to mount it at.
  string target = 2;
  // Whether the guest may write it. Read-only is also enforced on the host
  // (STO-2).
  bool read_write = 3;
}

// Disk is a host file attached to the VM as a block device (STO-1).
message Disk {
  // device: the agent finds a disk by its block id, never by its position
  // as a guest device name such as /dev/vdb.
  reserved 1;
  reserved "device";
  // The block id the host attaches the disk under, which the guest sees as
  // the virtio-blk serial in /sys/block/<dev>/serial: `disk<i>`, i being
  // its position in the profile's disks.
  string block_id = 4;
  // The absolute guest path to mount it at.
  string target = 2;
  // A read-write disk is mounted as ext4; a read-only disk as ext4 or EROFS,
  // whichever its superblock names (STO-4).
  bool read_write = 3;
}

// Network is the guest's static configuration on the job network, which the
// agent sets with no DHCP client: lo up, then the address, MTU and up on
// eth0, then the default route via the gateway. The gateway is also the
// guest's only name server, in /etc/resolv.conf.
message Network {
  // search_domain: there is no DNS zone, so no search domain (GST-12).
  reserved 4;
  reserved "search_domain";

  // The guest interface's address, in CIDR notation: an ordinary subnet,
  // not a /32.
  string address = 1;
  // The gateway's address, which also serves DNS (NET-5).
  string gateway = 2;
  // The interface's MTU.
  uint32 mtu = 3;
}

// Image is the image config's defaults for Exec, and the plugin's default
// PATH.
message Image {
  // The image's environment, as KEY=VALUE in the image's order (GST-4). An
  // Exec's environment is this, with the request's on top.
  repeated string env = 1;
  // The image's USER: the user an Exec that names none runs as; empty, root
  // (GST-5).
  string user = 2;
  // The image's WORKDIR: the working directory of an Exec that names none;
  // empty, `/` (GST-6).
  string working_dir = 3;
  // The PATH an Exec gets, and its command is looked up in, when neither the
  // image's environment nor the request's sets one (GST-4). The plugin sets
  // it to the default PATH Create returns to the runner, so both use one
  // value.
  string default_path = 4;
}
